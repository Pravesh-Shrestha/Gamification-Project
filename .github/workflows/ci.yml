name: CI Workflow

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main, development ]

jobs:
  backend:
    name: Backend CI (Node & Prisma)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?sslmode=disable"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/test?sslmode=disable"
      JWT_SECRET: "ci-secret-key-for-testing-12345"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Root & Backend Dependencies
        run: |
          npm install --legacy-peer-deps
          npm --prefix backend install --legacy-peer-deps

      - name: Generate Prisma Client
        run: |
          npm --prefix backend run db:generate

      - name: Typecheck & Build Backend
        run: |
          npm --prefix backend run build

  frontend:
    name: Frontend CI (Vite & React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Root & Frontend Dependencies
        run: |
          npm install --legacy-peer-deps
          npm --prefix frontend install --legacy-peer-deps

      - name: Build Frontend
        run: |
          npm --prefix frontend run build
